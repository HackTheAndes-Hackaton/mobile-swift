name: Tiskz
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TiskzCore:
    path: TiskzCore
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 155.0.0
targets:
  Tiskz:
    type: application
    platform: iOS
    sources:
      - path: Tiskz/App
      - path: Tiskz/Services
      - path: Tiskz/Views
      - path: Tiskz/Resources/Assets.xcassets
      - path: Tiskz/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: TiskzCore
      - package: WebRTC
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiskz.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: es
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Tiskz/Tiskz-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tiskz
        INFOPLIST_KEY_NSContactsUsageDescription: Tiskz muestra tus contactos y permite gestionarlos en este iPhone. No los envía al servidor.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Tiskz utiliza el micrófono para conversar y analizar audio cuando lo autorizas.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TiskzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TiskzUITests]
    dependencies:
      - target: Tiskz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiskz.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tiskz:
    build:
      targets:
        Tiskz: all
    test:
      targets: [TiskzUITests]
